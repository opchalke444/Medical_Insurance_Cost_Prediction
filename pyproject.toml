[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-insurance-cost-prediction"
version = "1.0.0"
description = "Academic Full-Stack Medical Insurance Cost Prediction using Machine Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["tests*", "docs*", "frontend*", "data*", "notebooks*", "scratch*"]

[tool.vercel]
entrypoint = "backend.app.main:app"
